<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatTrace · 聊天统计</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f5;color:#202a26;font:16px/1.55 system-ui,sans-serif}main{max-width:920px;margin:auto;padding:28px 20px}a{color:#216448}h1{margin:.4em 0}h2{font-size:1.1rem;margin:1.4em 0 .5em}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;font-size:.88rem;gap:4px}[hidden]{display:none!important}select,input{padding:7px;background:white;border:1px solid #9cac9f;border-radius:4px;color:inherit}table{width:100%;border-collapse:collapse;background:white}th,td{border-bottom:1px solid #d9ded8;padding:.45em .7em;text-align:left}th{font-weight:600}p{color:#46584e}.chart{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;background:white;padding:14px 4px}.hour{text-align:center;font-size:.65rem}.bars{height:85px;display:flex;align-items:end;justify-content:center;gap:1px}.bars i{width:37%;background:#287658}.bars i+i{background:#a55d27}.note{font-size:.85rem}.warn{color:#973a1b}
</style>
<main><a href="index.html">返回阅读首页</a><h1>聊天统计</h1>
<form><label>统计范围<select id="mode"><option value="all">全部记录</option><option value="day">按日</option><option value="week">按周（周一开始）</option><option value="month">按月</option><option value="custom">自定义时间段</option></select></label>
<label id="anchorLabel" hidden>选择所在日期<input id="anchor" type="date"></label>
<label id="fromLabel" hidden>开始（含）<input id="from" type="datetime-local" step="1"></label>
<label id="toLabel" hidden>结束（不含）<input id="to" type="datetime-local" step="1"></label></form>
<p id="summary" aria-live="polite"></p><section id="results"><table><thead><tr><th>指标</th><th>我</th><th>好友</th></tr></thead><tbody id="metrics"></tbody></table>
<h2>分时发言量</h2><div class="note">北京时间 00–23 时 · 绿色为我，棕色为好友</div><div id="chart" class="chart"></div><details><summary>查看每小时条数</summary><table><thead><tr><th>小时</th><th>我</th><th>好友</th></tr></thead><tbody id="hours"></tbody></table></details>
<p id="other" class="note"></p><p class="note">字数按所发文字及引用回复正文的非空白 Unicode 码点计算，含标点；媒体占位与被引用文字不计。活跃分钟按实际发过消息的自然分钟去重。</p></section></main>
<script id="logic">
function bounds(mode, date, from, to) {
  if(mode==='all') return ['',''];
  if(mode==='custom') {
    if(from?.length===16) from+=':00';
    if(to?.length===16) to+=':00';
    if(!from || !to || from>=to) throw Error('请选择开始和结束时间，结束须晚于开始。');
    return [from,to];
  }
  if(!date) throw Error('请选择日期。');
  const start=new Date(date+'T00:00:00Z');
  if(mode==='week') start.setUTCDate(start.getUTCDate()-(start.getUTCDay()+6)%7);
  if(mode==='month') start.setUTCDate(1);
  const end=new Date(start);
  if(mode==='month') end.setUTCMonth(end.getUTCMonth()+1);
  else end.setUTCDate(end.getUTCDate()+(mode==='week'?7:1));
  return [start,end].map(d=>d.toISOString().slice(0,10)+'T00:00:00');
}
function summarize(events, start, end) {
  const person=()=>({messages:0,chars:0,days:new Set(),minutes:new Set(),hours:Array(24).fill(0),first:'',last:''});
  const result={self:person(),friend:person(),system:0,unknown:0,total:0};
  for(const [time,role,chars] of events) {
    if((start && time<start)||(end && time>=end)) continue;
    result.total++;
    if(role==='system'||role==='unknown'){result[role]++;continue;}
    const p=result[role];p.messages++;p.chars+=chars;p.days.add(time.slice(0,10));p.minutes.add(time.slice(0,16));
    p.hours[Number(time.slice(11,13))]++;if(!p.first)p.first=time;p.last=time;
  }
  return result;
}
</script>
<script>
const data=/*STATS_DATA*/null;
const el=id=>document.getElementById(id);
const latest=data.events.at(-1)?.[0]?.slice(0,10) || new Date(Date.now()+8*3600000).toISOString().slice(0,10);
el('anchor').value=latest;el('from').value=(data.events[0]?.[0]?.slice(0,10)||latest)+'T00:00:00';el('to').value=bounds('day',latest)[1];
function row(target,values){const tr=target.insertRow();for(const val of values)tr.insertCell().textContent=val;}
function peak(p){const n=Math.max(...p.hours);return n?p.hours.flatMap((v,i)=>v===n?[String(i).padStart(2,'0')+' 时']:[]).join('、')+'（'+n+' 条）':'—';}
function draw(){
 const mode=el('mode').value;el('anchorLabel').hidden=!['day','week','month'].includes(mode);
 el('fromLabel').hidden=el('toLabel').hidden=mode!=='custom';
 let range;try{range=bounds(mode,el('anchor').value,el('from').value,el('to').value);}catch(e){el('summary').textContent=e.message;el('results').hidden=true;return;}
 el('results').hidden=false;
 const r=summarize(data.events,...range), people=[r.self,r.friend];
 el('summary').textContent=(mode==='all'?'全部有时间记录':range.map(t=>t.replace('T',' ')).join(' 至 ')+'（不含结束）')+' · 北京时间 · '+r.total+' 条';
 const table=el('metrics');table.replaceChildren();
 for(const [label,read] of [['消息条数',p=>p.messages],['字数',p=>p.chars],['发言天数',p=>p.days.size],['活跃分钟',p=>p.minutes.size],['发言高峰',peak],['首次发言',p=>p.first.replace('T',' ')||'—'],['末次发言',p=>p.last.replace('T',' ')||'—']])row(table,[label,...people.map(read)]);
 el('other').textContent='所选范围内系统消息 '+r.system+' 条，未知发送者 '+r.unknown+' 条。全库另有 '+data.undated+' 条缺少时间戳。';
 const chart=el('chart'),hours=el('hours');chart.replaceChildren();hours.replaceChildren();const max=Math.max(1,...people.flatMap(p=>p.hours));
 for(let h=0;h<24;h++){const col=document.createElement('div'),bars=document.createElement('div');col.className='hour';bars.className='bars';col.append(bars);
 for(const p of people){const bar=document.createElement('i');bar.style.height=(100*p.hours[h]/max)+'%';bars.append(bar);}
 col.append(String(h));col.title=h+' 时：我 '+r.self.hours[h]+' 条，好友 '+r.friend.hours[h]+' 条';chart.append(col);row(hours,[h+' 时',...people.map(p=>p.hours[h])]);}
}
document.querySelector('form').addEventListener('input',draw);document.querySelector('form').addEventListener('submit',e=>e.preventDefault());draw();
</script></html>
